# =====================================================================
# Harmy'Swing — Reverse proxy nginx
#
# Une seule origine publique (port 80) est exposée, ce qui évite tout
# problème de CORS et permet au frontend d'appeler l'API en relatif :
#   /            -> Angular SSR (Node, port 4000)
#   /api/v1/     -> API REST Spring Boot (port 8080, context-path /api/v1)
#   /socket.io/  -> Messagerie temps réel Netty-SocketIO (port 9092)
#   /uploads/    -> Images de créations, servies depuis le disque, avec
#                   bascule automatique sur l'API (donc Cloudflare R2)
#                   lorsque le fichier est absent du disque.
#
# Destination : /etc/nginx/sites-available/harmy
# =====================================================================

upstream harmy_frontend { server 127.0.0.1:4000; keepalive 16; }
upstream harmy_backend  { server 127.0.0.1:8080; keepalive 16; }
upstream harmy_socket   { server 127.0.0.1:9092; }

# Rétablissement de l'IP réelle des visiteurs derrière Cloudflare
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name harmyswing.projetutore.me 207.154.195.53 _;

    ssl_certificate /etc/ssl/certs/harmy.crt;
    ssl_certificate_key /etc/ssl/private/harmy.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Téléversement d'images de créations (limite applicative : 15 Mo).
    client_max_body_size 25M;

    access_log /var/log/nginx/harmy.access.log;
    error_log  /var/log/nginx/harmy.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/manifest+json image/svg+xml;

    # --- Images de créations ------------------------------------------
    # Chemin rapide : le fichier est lu directement sur le disque, sans
    # traverser la JVM. « root » (et non « alias ») est indispensable pour
    # que try_files fonctionne correctement.
    location /uploads/ {
        root /var/www/harmy;
        try_files $uri @stockage_secours;

        # La clé de chaque image est un UUID immuable. On n'utilise pas la
        # directive « expires », qui ajouterait un second en-tête Cache-Control
        # concurrent en plus de celui déclaré ici.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Secours : fichier absent du disque (panne disque, VPS reconstruit,
    # image écrite alors que le disque était indisponible). L'API va alors
    # la chercher sur Cloudflare R2.
    location @stockage_secours {
        rewrite ^/uploads/(.*)$ /api/v1/storage/$1 break;
        proxy_pass http://harmy_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- API REST Spring Boot ------------------------------------------
    # Pas d'URI après le nom d'upstream : nginx transmet /api/v1/... tel
    # quel, ce que le context-path Spring Boot attend.
    location /api/v1/ {
        proxy_pass http://harmy_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Messagerie instantanée (WebSocket) ---------------------------
    location /socket.io/ {
        proxy_pass http://harmy_socket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # --- Application Angular (SSR) ------------------------------------
    location / {
        proxy_pass http://harmy_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

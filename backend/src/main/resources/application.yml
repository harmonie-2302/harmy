spring:
  application:
    name: harmy-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/harmy_swing}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:2025}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:change-me-in-your-environment-with-a-long-random-secret}
  expiration: 86400000

cloudflare:
  r2:
    endpoint: ${CLOUDFLARE_R2_ENDPOINT:}
    bucket: ${CLOUDFLARE_R2_BUCKET:}
    access-key: ${CLOUDFLARE_R2_ACCESS_KEY:}
    secret-key: ${CLOUDFLARE_R2_SECRET_KEY:}
    public-url: ${CLOUDFLARE_R2_PUBLIC_URL:}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

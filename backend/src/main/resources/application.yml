spring:
  application:
    name: harmy-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/harmy_swing}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:2025}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Sans ces limites, Spring Boot applique 1 Mo par fichier : toute photo
      # prise au smartphone est alors rejetée avant même d'atteindre le
      # contrôleur. La marge reste sous le client_max_body_size de nginx (25 Mo).
      max-file-size: 15MB
      max-request-size: 20MB

jwt:
  secret: ${JWT_SECRET:harmysewing_ultra_secure_secret_key_2026_production_grade_token_signature_512bits}
  expiration: 86400000

# --- Stockage des images de créations ---------------------------------
# Redondance : chaque image est écrite à la fois sur le disque du VPS et sur
# Cloudflare R2 (voir ResilientStorageAdapter). Si l'un des deux est en panne,
# l'autre prend le relais, en écriture comme en lecture.
#   prefer=local -> disque interrogé d'abord (rapide, servi par nginx)
#   prefer=r2    -> R2 interrogé d'abord
harmy:
  storage:
    prefer: ${HARMY_STORAGE_PREFER:local}
    local:
      directory: ${HARMY_STORAGE_DIR:/var/www/harmy/uploads}
      public-path: ${HARMY_STORAGE_PUBLIC_PATH:/uploads}

cloudflare:
  r2:
    # Aucune valeur par défaut : les identifiants sont fournis par
    # /etc/harmy/backend.env et ne doivent pas être versionnés.
    # secret-key = SHA-256 (64 caractères hex) de la « Token value » Cloudflare.
    endpoint: ${CLOUDFLARE_R2_ENDPOINT:}
    bucket: ${CLOUDFLARE_R2_BUCKET:}
    access-key: ${CLOUDFLARE_R2_ACCESS_KEY:}
    secret-key: ${CLOUDFLARE_R2_SECRET_KEY:}
    public-url: ${CLOUDFLARE_R2_PUBLIC_URL:}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
